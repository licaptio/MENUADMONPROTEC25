const urls=docs.map(s=>URL.createObjectURL(new Blob([decode64(s)],{type:'text/html;charset=utf-8'})));
document.getElementById('f0').src=urls[0];document.getElementById('f1').src=urls[1];
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('iframe').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('f'+btn.dataset.i).classList.add('active')});
window.addEventListener('beforeunload',()=>urls.forEach(URL.revokeObjectURL));
</script></body></html>
